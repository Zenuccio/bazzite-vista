# yaml-language-server: $schema=https://blue-build.org
name: bazzite-vista
description: Custom Bazzite image with VistaThemePlasma.

base-image: ghcr.io/ublue-os/bazzite
image-version: stable

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    install:
      packages:
        - gdisk
        - python3-devel
        - wayland-devel
        - wayland-protocols-devel
        - plasma-wayland-protocols-devel
        - git
        - cmake
        - ninja-build
        - gcc-c++
        - extra-cmake-modules
        - plasma-workspace-devel
        - kwin-devel
        - libplasma-devel
        - plasma-activities-devel
        - plasma-activities-stats-devel
        - plasma5support-devel
        - kdecoration-devel
        - layer-shell-qt-devel
        - libepoxy-devel
        - polkit-devel
        - polkit-qt6-1-devel
        - xcb-util-wm-devel
        - xcb-util-image-devel
        - xcb-util-keysyms-devel
        - libX11-devel
        - libXext-devel
        - libXfixes-devel
        - libXrender-devel
        - kf6-kcmutils-devel
        - kf6-kconfig-devel
        - kf6-kcoreaddons-devel
        - kf6-kdbusaddons-devel
        - kf6-kglobalaccel-devel
        - kf6-ki18n-devel
        - kf6-kiconthemes-devel
        - kf6-kio-devel
        - kf6-knewstuff-devel
        - kf6-knotifications-devel
        - kf6-kpackage-devel
        - kf6-krunner-devel
        - kf6-kservice-devel
        - kf6-ksvg-devel
        - kf6-kwindowsystem-devel
        - kf6-kxmlgui-devel
        - kf6-solid-devel
        - kf6-sonnet-devel
        - kf6-kirigami-devel
        - kf6-karchive-devel
        - kf6-kauth-devel
        - kf6-kbookmarks-devel
        - kf6-kcodecs-devel
        - kf6-kcolorscheme-devel
        - kf6-kcompletion-devel
        - kf6-kconfigwidgets-devel
        - kf6-kcrash-devel
        - kf6-kdeclarative-devel
        - kf6-kded-devel
        - kf6-kdesu-devel
        - kf6-kdnssd-devel
        - kf6-kdoctools-devel
        - kf6-kfilemetadata-devel
        - kf6-kguiaddons-devel
        - kf6-kholidays-devel
        - kf6-kidletime-devel
        - kf6-kitemmodels-devel
        - kf6-kitemviews-devel
        - kf6-kjobwidgets-devel
        - kf6-knotifyconfig-devel
        - kf6-kparts-devel
        - kf6-kpeople-devel
        - kf6-kplotting-devel
        - kf6-kpty-devel
        - kf6-kquickcharts-devel
        - kf6-kstatusnotifieritem-devel
        - kf6-ktexteditor-devel
        - kf6-ktextwidgets-devel
        - kf6-kunitconversion-devel
        - kf6-kuserfeedback-devel
        - kf6-kwallet-devel
        - kf6-kwidgetsaddons-devel
        - kf6-networkmanager-qt-devel
        - kf6-prison-devel
        - kf6-purpose-devel
        - kf6-syndication-devel
        - kf6-syntax-highlighting-devel
        - kf6-threadweaver-devel
        - qt6-qtbase-devel
        - qt6-qtbase-private-devel
        - qt6-qtdeclarative-devel
        - qt6-qtdeclarative-private-devel
        - qt6-qtwayland-devel
        - qt6-qtsvg-devel
        - qt6-qttools-devel
        - qt6-qt5compat-devel
        - qt6-qtsensors-devel
        - qt6-qtmultimedia-devel

  - type: script
    snippets:
      - |
        set -euo pipefail
        printf '#!/bin/sh\nexec "$@"\n' > /tmp/sudo
        chmod +x /tmp/sudo
        export PATH="/tmp:$PATH"
        HOST="github.com"
        OWNER="aeroshell-desktop"
        PROJECT="vistathemeplasma.git"
        git clone --depth=1 -b Plasma/6.8 "https://${HOST}/${OWNER}/${PROJECT}" /usr/share/vtp-source
        cd /usr/share/vtp-source
        export CMAKE_GENERATOR=Ninja
        export LIBEXEC_DIR=libexec
        export UAC_LIBEXEC_DIR=libexec/kf6
        yes | bash install.sh
        rm -f /tmp/sudo

  - type: signing
