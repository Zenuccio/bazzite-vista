# yaml-language-server: $schema=https://blue-build.org
name: bazzite-vista
description: Custom Bazzite image with VistaThemePlasma.

base-image: ghcr.io/ublue-os/bazzite
image-version: stable

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    install:
      packages:
        - gdisk
        - python3-devel
        - wayland-devel
        - wayland-protocols-devel
        - plasma-wayland-protocols-devel
        - git
        - cmake
        - ninja-build
        - gcc-c++
        - extra-cmake-modules
        - plasma-workspace-devel
        - kwin-devel
        - libplasma-devel
        - kdecoration-devel
        - layer-shell-qt-devel
        - libepoxy-devel
        - xcb-util-wm-devel
        - xcb-util-image-devel
        - xcb-util-keysyms-devel
        - libX11-devel
        - libXext-devel
        - libXfixes-devel
        - libXrender-devel
        - kf6-kcmutils-devel
        - kf6-kconfig-devel
        - kf6-kcoreaddons-devel
        - kf6-kdbusaddons-devel
        - kf6-kglobalaccel-devel
        - kf6-ki18n-devel
        - kf6-kiconthemes-devel
        - kf6-kio-devel
        - kf6-knewstuff-devel
        - kf6-knotifications-devel
        - kf6-kpackage-devel
        - kf6-krunner-devel
        - kf6-kservice-devel
        - kf6-ksvg-devel
        - kf6-kwindowsystem-devel
        - kf6-kxmlgui-devel
        - kf6-solid-devel
        - kf6-sonnet-devel
        - kf6-kirigami-devel
        - qt6-qtbase-devel
        - qt6-qtbase-private-devel
        - qt6-qtdeclarative-devel
        - qt6-qtdeclarative-private-devel
        - qt6-qtwayland-devel
        - qt6-qtsvg-devel
        - qt6-qttools-devel
        - qt6-qt5compat-devel

  - type: script
    snippets:
      - |
        set -euo pipefail
        HOST="github.com"
        OWNER="aeroshell-desktop"
        PROJECT="vistathemeplasma.git"
        git clone --depth=1 -b Plasma/6.8 "https://${HOST}/${OWNER}/${PROJECT}" /tmp/vtp
        cd /tmp/vtp
        sed -i 's/sudo //g' install.sh
        export CMAKE_GENERATOR=Ninja
        export LIBEXEC_DIR=libexec
        export UAC_LIBEXEC_DIR=libexec/kf6
        yes | bash install.sh
        rm -rf /tmp/vtp

  - type: signing
