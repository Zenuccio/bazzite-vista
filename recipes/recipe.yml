# yaml-language-server: $schema=https://blue-build.org
name: bazzite-vista
description: Custom Bazzite image with VistaThemePlasma.

base-image: ghcr.io/ublue-os/bazzite
image-version: stable

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    install:
      packages:
        - gdisk
        - python3-devel
        # [Nota: La lista completa dei pacchetti DNF richiesti per la compilazione di VistaThemePlasma è disponibile nel repository ufficiale / file INSTALL.md del progetto]
        - layer-shell-qt-devel
        - wayland-protocols-devel

  - type: script
    snippets:
      - |
        set -euo pipefail
        HOST="github.com"
        OWNER="aeroshell-desktop"
        PROJECT="vistathemeplasma.git"
        git clone --depth=1 -b Plasma/6.8 "https://${HOST}/${OWNER}/${PROJECT}" /usr/share/vtp-source
        cd /usr/share/vtp-source
        sed -i 's/sudo //g' install.sh
        export CMAKE_GENERATOR=Ninja
        export LIBEXEC_DIR=libexec
        export UAC_LIBEXEC_DIR=libexec/kf6
        yes | bash install.sh

  - type: signing
